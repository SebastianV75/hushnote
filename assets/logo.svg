<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Hushnote logo">
  <defs>
    <linearGradient id="bg" x1="64" y1="0" x2="448" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B7BFF"/>
      <stop offset="0.55" stop-color="#5B45F0"/>
      <stop offset="1" stop-color="#2A1B9E"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9D3FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="18%" r="70%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#glow)"/>
  <!-- fading waveform: a voice dropping to a whisper -->
  <g fill="url(#bar)">
    <rect x="96"  y="196" width="40" height="120" rx="20" opacity="0.95"/>
    <rect x="156" y="146" width="40" height="220" rx="20"/>
    <rect x="216" y="96"  width="40" height="320" rx="20"/>
    <rect x="276" y="176" width="40" height="160" rx="20" opacity="0.7"/>
    <rect x="336" y="226" width="40" height="60"  rx="20" opacity="0.45"/>
    <rect x="396" y="244" width="20" height="24"  rx="10" opacity="0.28"/>
  </g>
</svg>
