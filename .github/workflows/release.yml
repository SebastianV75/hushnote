# Manual release. Nothing triggers this automatically.
#
# Bump `version` in Cargo.toml (and Cargo.lock) on main first, then run it from the repository's
# Actions tab ("Release" > "Run workflow", branch main) or with:
#
#   gh workflow run release.yml --ref main
#   gh workflow run release.yml --ref main -f notes="$(cat notes.md)"
#
# It runs scripts/ci.sh (tests, portable build, tarball and checksum) and then PUBLISHES the
# release v<version> right away, with no draft step. The in-app updater picks it up from there.
# It refuses to run if the version was already released: bump the version instead.
name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes (Markdown). Empty: generate them from the merged PRs."
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require the main branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases are only built from main (this run is on $GITHUB_REF)."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version and check it is new
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cargo.toml version '$version' is not in the form x.y.z."
            exit 1
          fi

          # Succeeds when the API answers 404, fails on anything else (so an outage is not
          # mistaken for "does not exist").
          absent() {
            local out
            if out=$(gh api "$1" 2>&1); then
              return 1
            elif [[ "$out" == *"HTTP 404"* ]]; then
              return 0
            fi
            echo "::error::Could not query $1: $out"
            exit 1
          }
          if ! absent "repos/$GH_REPO/git/ref/tags/v$version" ||
             ! absent "repos/$GH_REPO/releases/tags/v$version"; then
            echo "::error::v$version already exists. Bump the version in Cargo.toml first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential cmake pkg-config libxkbcommon-dev

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Test, build and package
        run: bash scripts/ci.sh

      - name: Check Cargo.lock is unchanged
        run: git diff --exit-code Cargo.lock

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            dist/hushnote-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
            dist/hushnote-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      NOTES: ${{ inputs.notes }}
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Verify the checksum
        working-directory: dist
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha256sum -c "hushnote-$VERSION-linux-x86_64.tar.gz.sha256"
          files=(*)
          [[ ${#files[@]} -eq 2 ]]

      - name: Create the release
        run: |
          absent() {
            local out
            if out=$(gh api "$1" 2>&1); then
              return 1
            elif [[ "$out" == *"HTTP 404"* ]]; then
              return 0
            fi
            echo "::error::Could not query $1: $out"
            exit 1
          }
          if ! absent "repos/$GH_REPO/git/ref/tags/v$VERSION" ||
             ! absent "repos/$GH_REPO/releases/tags/v$VERSION"; then
            echo "::error::v$VERSION already exists. Bump the version in Cargo.toml first."
            exit 1
          fi

          if [[ -n "${NOTES//[[:space:]]/}" ]]; then
            printf '%s\n' "$NOTES" > notes.md
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi

          # With assets, gh creates a draft, uploads the files and only then publishes it, so a
          # half-uploaded release is never visible.
          gh release create "v$VERSION" \
            "dist/hushnote-$VERSION-linux-x86_64.tar.gz" \
            "dist/hushnote-$VERSION-linux-x86_64.tar.gz.sha256" \
            --target "$GITHUB_SHA" \
            --title "Hushnote $VERSION" \
            --latest \
            "${notes[@]}"
