[package]
name = "hushnote"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Notas de reuniones con transcripción y resúmenes 100% locales, hecho con Rune"

[features]
default = []
# Transcripción en GPU con Vulkan (como Hex). Sin ella corre en CPU.
vulkan = ["transcribe-cpp/vulkan"]

[dependencies]
# Rune fijado a un commit de `dev` (su README: "Depending on Rune").
rune = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721", features = ["markdown"] }
# El mismo motor de transcripción local que Hex.
transcribe-cpp = "=0.4.1"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
hound = "3.5"

[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }

[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false
opt-level = 2
