[package]
name = "hushnote"
version = "0.2.3"
edition = "2024"
license = "MIT"
description = "Meeting notes with transcription and summaries that stay 100% on your machine, built with Rune"

[features]
default = []
# Transcription on the GPU with Vulkan (as Hex does). Without it, it runs on the CPU.
vulkan = ["transcribe-cpp/vulkan"]

[dependencies]
# Rune pinned to a commit on `dev` (its README: "Depending on Rune").
rune = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721", features = ["markdown"] }
# The same local speech engine as Hex (0.4.2: the bindings must match transcribe-cpp-sys).
transcribe-cpp = "=0.4.2"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
hound = "3.5"
libc = "0.2"
sha2 = "0.10"

[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }

[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false
opt-level = 2

# The binary people install (scripts/ci.sh builds it): small and fast. The speech engine (C++)
# is always built optimized; ci.sh pins its CPU floor so it runs on any x86-64 laptop with AVX2.
[profile.release]
lto = "thin"
codegen-units = 4
strip = true
